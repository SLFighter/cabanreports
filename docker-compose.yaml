services:
  app:
    build: .
    restart: unless-stopped
    environment:
      REQUIRE_VERIFICATION: none
      REGISTRATIONS_PER_IP_PER_DAY: 3
      SESSION_TTL_DAYS: 30
      POW_DIFFICULTY_BITS: 19
      IP_HASH_SECRET: change-me-to-random-string
      TELEGRAM_BOT_TOKEN: ""
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
