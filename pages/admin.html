<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles/style.css">
<title>Панель админа - Кабаньи сводки</title>
</head>
<body>
<!-- header:start -->
<!-- тот же блок header, что в login.html -->
<!-- header:end -->
<main>
  <section class="admin">
    <p><a href="../index.html">← на сайт</a></p>
    <h2>Панель админа</h2>
    <div class="tabs" id="tabs"></div>
    <div class="admin-toolbar">
      <input type="text" id="q" placeholder="поиск...">
      <button id="prev">←</button>
      <span id="pageinfo"></span>
      <button id="next">→</button>
    </div>
    <div id="msg"></div>
    <div class="grid-wrap"><table id="grid"></table></div>
  </section>
</main>
<footer><p>© 2026 Caban Reports</p></footer>

<script>
(async function () {
  const LIMIT = 50;
  const USER_TABLE = 'users';
  const NICK_COLS = ['username', 'nick', 'login'];
  let meta, table = 'users', offset = 0, total = 0;
  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $('msg').textContent = t || ''; };

  async function api(method, url, body) {
    const r = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
    return data;
  }

  try { meta = await api('GET', '/api/admin/tables'); }
  catch (e) {
    document.querySelector('main').innerHTML =
      '<section class="admin"><p>Доступ запрещён: ' + e.message +
      '</p><p><a href="../index.html">на главную</a></p></section>';
    return;
  }

  Object.keys(meta).forEach((name) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { table = name; offset = 0; $('q').value = ''; load(); };
    b.dataset.t = name;
    $('tabs').appendChild(b);
  });

  const short = (v) => {
    const s = v == null ? '' : String(v);
    return s.length > 80 ? s.slice(0, 80) + '…' : s;
  };
  const rowLines = (m, row) => m.cols.map((c) => c + ': ' + short(row[c])).join('\n');
  const nickOf = (row) => {
    const k = NICK_COLS.find((c) => row[c] != null);
    return k ? String(row[k]) : null;
  };

  async function load() {
    msg('');
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === table));
    const q = encodeURIComponent($('q').value);
    const data = await api('GET', `/api/admin/tables/${table}?limit=${LIMIT}&offset=${offset}&q=${q}`);
    total = data.total;
    $('pageinfo').textContent = `${Math.min(offset + 1, total)}–${Math.min(offset + LIMIT, total)} из ${total}`;
    render(data.rows);
  }

  function render(rows) {
    const m = meta[table], grid = $('grid');
    grid.innerHTML = '';
    const head = grid.insertRow();
    m.cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; head.appendChild(th); });
    head.appendChild(document.createElement('th'));

    rows.forEach((row) => {
      const tr = grid.insertRow();
      const pk = {}; m.pk.forEach((k) => { pk[k] = row[k]; });

      m.cols.forEach((c) => {
        const td = tr.insertCell();
        if (m.editable.includes(c)) {
          const inp = document.createElement('input');
          let old = row[c] == null ? '' : String(row[c]);
          inp.value = old;
          inp.onchange = async () => {
            const nv = inp.value;
            if (nv === old) return;
            const ok = confirm(
              'действительно изменить поле «' + c + '» в следующих строках:\n' +
              rowLines(m, row) + '\n' +
              c + ': ' + short(old) + ' → ' + short(nv) + '\n?'
            );
            if (!ok) { inp.value = old; inp.className = ''; return; }
            try {
              await api('PATCH', '/api/admin/tables/' + table, { pk, changes: { [c]: nv } });
              old = nv; row[c] = nv;
              inp.className = 'saved'; msg('');
            } catch (e) { inp.className = 'err'; msg('Ошибка: ' + e.message); }
          };
          td.appendChild(inp);
        } else {
          td.textContent = row[c] == null ? '' : row[c];
        }
      });

      const del = tr.insertCell();
      const btn = document.createElement('button');
      btn.textContent = '🗑';
      btn.onclick = async () => {
        if (table === USER_TABLE) {
          const nick = nickOf(row);
          if (nick == null) { msg('Ошибка: не найдена колонка с ником (' + NICK_COLS.join('/') + ')'); return; }
          const typed = prompt('для подтверждения удаления юзера введи ник:\n' + rowLines(m, row));
          if (typed === null) return;
          if (typed.trim() !== nick) { msg('Ник не совпал, удаление отменено'); return; }
        } else {
          const ok = confirm(
            'действительно удалить запись из «' + table + '» в следующих строках:\n' +
            rowLines(m, row) + '\n?'
          );
          if (!ok) return;
        }
        try { await api('DELETE', '/api/admin/tables/' + table, { pk }); load(); }
        catch (e) { msg('Ошибка: ' + e.message); }
      };
      del.appendChild(btn);
    });
  }

  $('prev').onclick = () => { offset = Math.max(0, offset - LIMIT); load(); };
  $('next').onclick = () => { if (offset + LIMIT < total) { offset += LIMIT; load(); } };
  let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(() => { offset = 0; load(); }, 300); };

  load();
})();
</script>
</body>
</html>
